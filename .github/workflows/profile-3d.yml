name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub Profile 3D Contrib

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ============================================================
      # 2. GENERATE OFFICIAL 3D CONTRIBUTION GRAPH
      # ============================================================

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}


      # ============================================================
      # 3. CREATE DARK GIT BLOCK
      # ============================================================

      - name: Create Dark Git Block
        shell: bash
        run: |

          INPUT="profile-3d-contrib/profile-gitblock.svg"
          OUTPUT="profile-3d-contrib/profile-gitblock-dark.svg"

          python3 <<'PY'

          from pathlib import Path
          import re


          # ========================================================
          # LOAD SVG
          # ========================================================

          input_file = Path(
              "profile-3d-contrib/profile-gitblock.svg"
          )

          output_file = Path(
              "profile-3d-contrib/profile-gitblock-dark.svg"
          )

          svg = input_file.read_text(
              encoding="utf-8"
          )


          # ========================================================
          # BACKGROUND
          # ========================================================

          # Change white/light backgrounds to GitHub dark.

          svg = svg.replace(
              "#ffffff",
              "#0d1117"
          )

          svg = svg.replace(
              "#FFFFFF",
              "#0d1117"
          )

          svg = svg.replace(
              "#fff",
              "#0d1117"
          )

          svg = svg.replace(
              "#FFF",
              "#0d1117"
          )


          # ========================================================
          # EMPTY GRID / CELLS
          # ========================================================

          svg = svg.replace(
              "#f8f8f8",
              "#161b22"
          )

          svg = svg.replace(
              "#F8F8F8",
              "#161b22"
          )

          svg = svg.replace(
              "#f5f5f5",
              "#161b22"
          )

          svg = svg.replace(
              "#F5F5F5",
              "#161b22"
          )

          svg = svg.replace(
              "#eeeeee",
              "#21262d"
          )

          svg = svg.replace(
              "#EEEEEE",
              "#21262d"
          )

          svg = svg.replace(
              "#dddddd",
              "#30363d"
          )

          svg = svg.replace(
              "#DDDDDD",
              "#30363d"
          )


          # ========================================================
          # GREEN LEGO BLOCKS
          # ========================================================

          green_colors = {

              "#00ff00": "#39d353",
              "#00FF00": "#39d353",

              "#00cc00": "#2ea043",
              "#00CC00": "#2ea043",

              "#00b300": "#2ea043",

              "#008000": "#238636",

              "#32cd32": "#39d353",

              "#228b22": "#238636",
          }

          for old, new in green_colors.items():
              svg = svg.replace(old, new)


          # ========================================================
          # BLUE LEGO BLOCKS
          # ========================================================

          blue_colors = {

              "#0000ff": "#58a6ff",
              "#0000FF": "#58a6ff",

              "#0000cc": "#388bfd",
              "#0000CC": "#388bfd",

              "#4169e1": "#58a6ff",

              "#000080": "#1f6feb",
          }

          for old, new in blue_colors.items():
              svg = svg.replace(old, new)


          # ========================================================
          # RED LEGO BLOCKS
          # ========================================================

          red_colors = {

              "#ff0000": "#f778ba",
              "#FF0000": "#f778ba",

              "#cc0000": "#db61a2",
              "#CC0000": "#db61a2",

              "#8b0000": "#a40e4c",
          }

          for old, new in red_colors.items():
              svg = svg.replace(old, new)


          # ========================================================
          # YELLOW LEGO BLOCKS
          # ========================================================

          yellow_colors = {

              "#ffff00": "#d29922",
              "#FFFF00": "#d29922",

              "#ffd700": "#e3b341",
              "#FFD700": "#e3b341",

              "#ffcc00": "#d29922",
              "#FFCC00": "#d29922",
          }

          for old, new in yellow_colors.items():
              svg = svg.replace(old, new)


          # ========================================================
          # GRAY / GRID COLORS
          # ========================================================

          gray_colors = {

              "#666666": "#8b949e",
              "#666": "#8b949e",

              "#999999": "#8b949e",
              "#999": "#8b949e",

              "#aaaaaa": "#8b949e",
              "#AAAAAA": "#8b949e",

              "#333333": "#30363d",
              "#333": "#30363d",
          }

          for old, new in gray_colors.items():
              svg = svg.replace(old, new)


          # ========================================================
          # RGB COLORS
          # ========================================================

          rgb_colors = {

              "rgb(0,255,0)": "#39d353",
              "rgb(0, 255, 0)": "#39d353",

              "rgb(0,0,255)": "#58a6ff",
              "rgb(0, 0, 255)": "#58a6ff",

              "rgb(255,0,0)": "#f778ba",
              "rgb(255, 0, 0)": "#f778ba",

              "rgb(255,255,0)": "#d29922",
              "rgb(255, 255, 0)": "#d29922",
          }

          for old, new in rgb_colors.items():
              svg = svg.replace(old, new)


          # ========================================================
          # IMPORTANT:
          # DO NOT TURN BLACK INTO THE BACKGROUND
          # ========================================================
          #
          # The original Git Block uses black for many text elements.
          # Previously we converted black -> #0d1117, which caused:
          #
          # Commit
          # Issue
          # PullReq
          # Review
          # Repo
          # TypeScript
          # Python
          # JavaScript
          # CSS
          # Java
          # other
          # contributions
          # star/fork statistics
          #
          # to disappear.
          #
          # Instead, convert black text to GitHub primary text.
          # ========================================================

          svg = re.sub(
              r'fill\s*=\s*["\']#000000["\']',
              'fill="#f0f6fc"',
              svg,
              flags=re.IGNORECASE
          )

          svg = re.sub(
              r'fill\s*=\s*["\']black["\']',
              'fill="#f0f6fc"',
              svg,
              flags=re.IGNORECASE
          )


          # ========================================================
          # STROKE COLORS
          # ========================================================

          # Keep LEGO outlines dark rather than turning them white.

          svg = re.sub(
              r'stroke\s*=\s*["\']#000000["\']',
              'stroke="#30363d"',
              svg,
              flags=re.IGNORECASE
          )

          svg = re.sub(
              r'stroke\s*=\s*["\']black["\']',
              'stroke="#30363d"',
              svg,
              flags=re.IGNORECASE
          )


          # ========================================================
          # TEXT ELEMENTS
          # ========================================================

          # Make SVG text readable regardless of whether its original
          # color was represented through a style attribute.

          def fix_text_element(match):

              element = match.group(0)

              # Remove dark text fills from text elements.
              element = re.sub(
                  r'fill\s*:\s*#000000',
                  'fill:#f0f6fc',
                  element,
                  flags=re.IGNORECASE
              )

              element = re.sub(
                  r'fill\s*:\s*black',
                  'fill:#f0f6fc',
                  element,
                  flags=re.IGNORECASE
              )

              element = re.sub(
                  r'fill\s*=\s*["\']#000000["\']',
                  'fill="#f0f6fc"',
                  element,
                  flags=re.IGNORECASE
              )

              element = re.sub(
                  r'fill\s*=\s*["\']black["\']',
                  'fill="#f0f6fc"',
                  element,
                  flags=re.IGNORECASE
              )

              return element


          svg = re.sub(
              r'<text\b[^>]*>.*?</text>',
              fix_text_element,
              svg,
              flags=re.IGNORECASE | re.DOTALL
          )


          # ========================================================
          # CONTRIBUTION COUNT
          # ========================================================

          # Make the contribution number and statistics bright.

          dark_stat_colors = [

              "#101050",
              "#10104f",

              "#111050",
              "#11104f",

              "#111150",
              "#11114f",

              "#000050",
              "#00004f",

              "#161650",
              "#16164f",

              "#1a145f",
              "#17135f",

              "#0f0f5f",

              "#111133",
              "#111144",
              "#111155",

              "#121250",
              "#131350",
              "#141450",

              "#151550",
              "#15154f",

              "#171750",
              "#181850",
              "#191950",

              "#1a1a50",

              "#202050",
              "#202060",
              "#202070",
          ]

          for color in dark_stat_colors:

              svg = svg.replace(
                  color,
                  "#f0f6fc"
              )


          # ========================================================
          # FINAL TEXT SAFETY
          # ========================================================

          # If any text element still has a very dark fill,
          # make it readable.

          def final_text_fix(match):

              element = match.group(0)

              dark_fills = [
                  "#000000",
                  "#000",
                  "#101010",
                  "#111111",
                  "#111",
                  "#121212",
                  "#151515",
                  "#161616",
                  "#171717",
                  "#181818",
                  "#191919",
                  "#1a1a1a",
                  "#1b1b1b",
                  "#1c1c1c",
                  "#1d1d1d",
                  "#1e1e1e",
                  "#1f1f1f",
              ]

              for color in dark_fills:

                  element = element.replace(
                      color,
                      "#f0f6fc"
                  )

              return element


          svg = re.sub(
              r'<text\b[^>]*>.*?</text>',
              final_text_fix,
              svg,
              flags=re.IGNORECASE | re.DOTALL
          )


          # ========================================================
          # SAVE
          # ========================================================

          output_file.write_text(
              svg,
              encoding="utf-8"
          )


          print()
          print("==============================================")
          print(" DARK GIT BLOCK GENERATED")
          print("==============================================")
          print("Background : #0d1117")
          print("Empty cells: #161b22")
          print("Green      : #39d353")
          print("Blue       : #58a6ff")
          print("Pink       : #f778ba")
          print("Gold       : #d29922")
          print("Text       : #f0f6fc")
          print("Grid       : #30363d")
          print("==============================================")
          print()

          PY


      # ============================================================
      # 4. COMMIT AND PUSH
      # ============================================================

      - name: Commit & Push
        shell: bash
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "generated"

          git pull --rebase origin main

          git push origin HEAD:main
