name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub Profile 3D Contrib

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ============================================================
      # GENERATE ORIGINAL GITBLOCK
      # ============================================================

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}


      # ============================================================
      # CREATE DARK GITBLOCK
      # ============================================================

      - name: Create Dark GitBlock
        shell: bash
        run: |

          python3 <<'PY'

          from pathlib import Path
          import re


          input_file = Path(
              "profile-3d-contrib/profile-gitblock.svg"
          )

          output_file = Path(
              "profile-3d-contrib/profile-gitblock-dark.svg"
          )


          # ========================================================
          # READ SVG
          # ========================================================

          svg = input_file.read_text(
              encoding="utf-8"
          )


          # ========================================================
          # DARK BACKGROUND
          # ========================================================

          background_replacements = {

              "#ffffff": "#0d1117",
              "#FFFFFF": "#0d1117",

              "#fff": "#0d1117",
              "#FFF": "#0d1117",

          }

          for old, new in background_replacements.items():
              svg = svg.replace(old, new)


          # ========================================================
          # EMPTY CONTRIBUTION CELLS
          # ========================================================

          empty_cells = {

              "#f8f8f8": "#161b22",
              "#F8F8F8": "#161b22",

              "#f5f5f5": "#161b22",
              "#F5F5F5": "#161b22",

              "#eeeeee": "#21262d",
              "#EEEEEE": "#21262d",

              "#dddddd": "#30363d",
              "#DDDDDD": "#30363d",

          }

          for old, new in empty_cells.items():
              svg = svg.replace(old, new)


          # ========================================================
          # GREEN LEGO
          # ========================================================

          green = {

              "#00ff00": "#39d353",
              "#00FF00": "#39d353",

              "#00cc00": "#2ea043",
              "#00CC00": "#2ea043",

              "#00b300": "#2ea043",

              "#008000": "#238636",

              "#32cd32": "#39d353",

              "#228b22": "#238636",

          }

          for old, new in green.items():
              svg = svg.replace(old, new)


          # ========================================================
          # BLUE LEGO
          # ========================================================

          blue = {

              "#0000ff": "#58a6ff",
              "#0000FF": "#58a6ff",

              "#0000cc": "#388bfd",
              "#0000CC": "#388bfd",

              "#4169e1": "#58a6ff",

              "#000080": "#1f6feb",

          }

          for old, new in blue.items():
              svg = svg.replace(old, new)


          # ========================================================
          # RED / PINK LEGO
          # ========================================================

          red = {

              "#ff0000": "#f778ba",
              "#FF0000": "#f778ba",

              "#cc0000": "#db61a2",
              "#CC0000": "#db61a2",

              "#8b0000": "#a40e4c",

          }

          for old, new in red.items():
              svg = svg.replace(old, new)


          # ========================================================
          # YELLOW / GOLD LEGO
          # ========================================================

          yellow = {

              "#ffff00": "#d29922",
              "#FFFF00": "#d29922",

              "#ffd700": "#e3b341",
              "#FFD700": "#e3b341",

              "#ffcc00": "#d29922",
              "#FFCC00": "#d29922",

          }

          for old, new in yellow.items():
              svg = svg.replace(old, new)


          # ========================================================
          # GRID
          # ========================================================

          grid = {

              "#666666": "#8b949e",
              "#666": "#8b949e",

              "#999999": "#8b949e",
              "#999": "#8b949e",

              "#aaaaaa": "#8b949e",
              "#AAAAAA": "#8b949e",

              "#333333": "#30363d",
              "#333": "#30363d",

          }

          for old, new in grid.items():
              svg = svg.replace(old, new)


          # ========================================================
          # RGB COLORS
          # ========================================================

          rgb = {

              "rgb(0,255,0)": "#39d353",
              "rgb(0, 255, 0)": "#39d353",

              "rgb(0,0,255)": "#58a6ff",
              "rgb(0, 0, 255)": "#58a6ff",

              "rgb(255,0,0)": "#f778ba",
              "rgb(255, 0, 0)": "#f778ba",

              "rgb(255,255,0)": "#d29922",
              "rgb(255, 255, 0)": "#d29922",

          }

          for old, new in rgb.items():
              svg = svg.replace(old, new)


          # ========================================================
          # CRITICAL TEXT FIX
          # ========================================================
          #
          # Instead of trying to guess every original black color,
          # force ALL SVG text to GitHub's light text color.
          #
          # This fixes:
          #
          # Commit
          # Issue
          # PullReq
          # Review
          # Repo
          # TypeScript
          # Python
          # JavaScript
          # CSS
          # Java
          # other
          # contributions
          # dates
          # ========================================================

          text_color = "#f0f6fc"


          # --------------------------------------------------------
          # Add fill directly to every <text> element
          # --------------------------------------------------------

          def fix_text(match):

              tag = match.group(0)

              # Remove existing fill attribute
              tag = re.sub(
                  r'\sfill\s*=\s*["\'][^"\']*["\']',
                  '',
                  tag,
                  flags=re.IGNORECASE
              )

              # Add our light fill
              tag = tag.replace(
                  '<text',
                  f'<text fill="{text_color}"',
                  1
              )

              return tag


          svg = re.sub(
              r'<text\b[^>]*>',
              fix_text,
              svg,
              flags=re.IGNORECASE
          )


          # ========================================================
          # FIX TSPAN ELEMENTS
          # ========================================================

          def fix_tspan(match):

              tag = match.group(0)

              tag = re.sub(
                  r'\sfill\s*=\s*["\'][^"\']*["\']',
                  '',
                  tag,
                  flags=re.IGNORECASE
              )

              tag = tag.replace(
                  '<tspan',
                  f'<tspan fill="{text_color}"',
                  1
              )

              return tag


          svg = re.sub(
              r'<tspan\b[^>]*>',
              fix_tspan,
              svg,
              flags=re.IGNORECASE
          )


          # ========================================================
          # FIX CSS TEXT STYLES
          # ========================================================

          # Replace common black text declarations.

          svg = re.sub(
              r'fill\s*:\s*#000000',
              f'fill:{text_color}',
              svg,
              flags=re.IGNORECASE
          )

          svg = re.sub(
              r'fill\s*:\s*#000',
              f'fill:{text_color}',
              svg,
              flags=re.IGNORECASE
          )

          svg = re.sub(
              r'fill\s*:\s*black',
              f'fill:{text_color}',
              svg,
              flags=re.IGNORECASE
          )


          # ========================================================
          # FORCE SVG TEXT WITH CSS
          # ========================================================

          css = f"""
          <style>
            text {{
              fill: {text_color} !important;
              color: {text_color} !important;
            }}

            tspan {{
              fill: {text_color} !important;
            }}
          </style>
          """


          # Insert CSS immediately after <svg ...>
          svg = re.sub(
              r'(<svg\b[^>]*>)',
              r'\1' + css,
              svg,
              count=1,
              flags=re.IGNORECASE
          )


          # ========================================================
          # FIX BLACK STAT ICONS
          # ========================================================
          #
          # GitBlock uses paths for some of the statistics/icons.
          # Replace only paths containing very dark fills that are
          # commonly used for the stat area.
          #
          # We deliberately do NOT globally replace every black path,
          # because that would destroy the dark grid.
          # ========================================================

          def fix_dark_stat_group(match):

              group = match.group(0)

              # If this group contains text/stat related elements,
              # make dark fills readable.

              group = group.replace(
                  'fill="#000000"',
                  f'fill="{text_color}"'
              )

              group = group.replace(
                  'fill="#000"',
                  f'fill="{text_color}"'
              )

              return group


          # ========================================================
          # FINAL SVG
          # ========================================================

          output_file.write_text(
              svg,
              encoding="utf-8"
          )


          print()
          print("==============================================")
          print(" DARK GITBLOCK GENERATED SUCCESSFULLY")
          print("==============================================")
          print("Background : #0d1117")
          print("Empty      : #161b22")
          print("Grid       : #30363d")
          print("Green      : #39d353")
          print("Blue       : #58a6ff")
          print("Pink       : #f778ba")
          print("Gold       : #d29922")
          print("Text       : #f0f6fc")
          print("==============================================")
          print()

          PY


      # ============================================================
      # COMMIT AND PUSH
      # ============================================================

      - name: Commit & Push
        shell: bash
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "generated"

          git pull --rebase origin main

          git push origin HEAD:main
