name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub Profile 3D Contrib

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ============================================================
      # 2. GENERATE OFFICIAL 3D CONTRIBUTION GRAPHS
      # ============================================================

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}


      # ============================================================
      # 3. CREATE DARK GIT BLOCK VERSION
      # ============================================================

      - name: Create Dark Git Block
        shell: bash
        run: |

          INPUT="profile-3d-contrib/profile-gitblock.svg"
          OUTPUT="profile-3d-contrib/profile-gitblock-dark.svg"

          python3 <<'PY'

          from pathlib import Path
          import re


          # ========================================================
          # FILES
          # ========================================================

          input_file = Path(
              "profile-3d-contrib/profile-gitblock.svg"
          )

          output_file = Path(
              "profile-3d-contrib/profile-gitblock-dark.svg"
          )


          # Read original Git Block SVG
          svg = input_file.read_text(
              encoding="utf-8"
          )


          # ========================================================
          # DARK GITHUB COLOR PALETTE
          # ========================================================

          replacements = {

              # ----------------------------------------------------
              # BACKGROUND
              # ----------------------------------------------------

              "#ffffff": "#0d1117",
              "#FFFFFF": "#0d1117",

              "#fff": "#0d1117",
              "#FFF": "#0d1117",


              # ----------------------------------------------------
              # EMPTY CONTRIBUTION CELLS
              # ----------------------------------------------------

              "#f8f8f8": "#161b22",
              "#F8F8F8": "#161b22",

              "#f5f5f5": "#161b22",
              "#F5F5F5": "#161b22",

              "#eeeeee": "#21262d",
              "#EEEEEE": "#21262d",

              "#dddddd": "#30363d",
              "#DDDDDD": "#30363d",


              # ----------------------------------------------------
              # GREEN
              # ----------------------------------------------------

              "#00ff00": "#39d353",
              "#00FF00": "#39d353",

              "#00cc00": "#2ea043",
              "#00CC00": "#2ea043",

              "#00b300": "#2ea043",

              "#008000": "#238636",

              "#32cd32": "#39d353",

              "#228b22": "#238636",


              # ----------------------------------------------------
              # BLUE
              # ----------------------------------------------------

              "#0000ff": "#58a6ff",
              "#0000FF": "#58a6ff",

              "#0000cc": "#388bfd",
              "#0000CC": "#388bfd",

              "#4169e1": "#58a6ff",

              "#000080": "#1f6feb",


              # ----------------------------------------------------
              # RED -> PINK
              # ----------------------------------------------------

              "#ff0000": "#f778ba",
              "#FF0000": "#f778ba",

              "#cc0000": "#db61a2",
              "#CC0000": "#db61a2",

              "#8b0000": "#a40e4c",


              # ----------------------------------------------------
              # YELLOW -> GOLD
              # ----------------------------------------------------

              "#ffff00": "#d29922",
              "#FFFF00": "#d29922",

              "#ffd700": "#e3b341",
              "#FFD700": "#e3b341",

              "#ffcc00": "#d29922",
              "#FFCC00": "#d29922",


              # ----------------------------------------------------
              # GRAYS
              # ----------------------------------------------------

              "#666666": "#8b949e",
              "#666": "#8b949e",

              "#999999": "#8b949e",
              "#999": "#8b949e",

              "#aaaaaa": "#8b949e",
              "#AAAAAA": "#8b949e",


              # ----------------------------------------------------
              # BLACK
              # ----------------------------------------------------

              "#000000": "#0d1117",
          }


          # ========================================================
          # APPLY HEX COLOR REPLACEMENTS
          # ========================================================

          for old_color, new_color in replacements.items():

              svg = svg.replace(
                  old_color,
                  new_color
              )


          # ========================================================
          # RGB COLOR REPLACEMENTS
          # ========================================================

          rgb_replacements = {

              "rgb(0,255,0)": "#39d353",
              "rgb(0, 255, 0)": "#39d353",

              "rgb(0,0,255)": "#58a6ff",
              "rgb(0, 0, 255)": "#58a6ff",

              "rgb(255,0,0)": "#f778ba",
              "rgb(255, 0, 0)": "#f778ba",

              "rgb(255,255,0)": "#d29922",
              "rgb(255, 255, 0)": "#d29922",

              "rgb(255,255,255)": "#0d1117",
              "rgb(255, 255, 255)": "#0d1117",

              "rgb(0,0,0)": "#0d1117",
              "rgb(0, 0, 0)": "#0d1117",
          }


          for old_color, new_color in rgb_replacements.items():

              svg = svg.replace(
                  old_color,
                  new_color
              )


          # ========================================================
          # TEXT
          # ========================================================

          # Make black text readable on dark background

          svg = re.sub(
              r'fill=["\']#000000["\']',
              'fill="#f0f6fc"',
              svg,
              flags=re.IGNORECASE
          )

          svg = re.sub(
              r'fill=["\']black["\']',
              'fill="#f0f6fc"',
              svg,
              flags=re.IGNORECASE
          )


          # ========================================================
          # BORDERS / GRID
          # ========================================================

          svg = svg.replace(
              "#333333",
              "#30363d"
          )

          svg = svg.replace(
              "#333",
              "#30363d"
          )


          # ========================================================
          # CONTRIBUTION NUMBER
          # ========================================================
          #
          # The Git Block SVG can use a very dark purple/navy
          # color for the contribution count.
          #
          # Replace those dark variants with GitHub primary text.
          # ========================================================

          contribution_colors = {

              "#101050": "#f0f6fc",
              "#10104f": "#f0f6fc",

              "#111050": "#f0f6fc",
              "#11104f": "#f0f6fc",

              "#111150": "#f0f6fc",
              "#11114f": "#f0f6fc",

              "#000050": "#f0f6fc",
              "#00004f": "#f0f6fc",

              "#161650": "#f0f6fc",
              "#16164f": "#f0f6fc",

              "#1a145f": "#f0f6fc",
              "#17135f": "#f0f6fc",

              "#0f0f5f": "#f0f6fc",
          }


          for old_color, new_color in contribution_colors.items():

              svg = svg.replace(
                  old_color,
                  new_color
              )


          # ========================================================
          # FINAL CONTRIBUTION TEXT SAFETY
          # ========================================================

          # Catch common dark blue/purple colors used by the
          # contribution statistic.

          dark_stat_colors = [
              "#111133",
              "#111144",
              "#111155",
              "#121250",
              "#131350",
              "#141450",
              "#151550",
              "#15154f",
              "#171750",
              "#181850",
              "#191950",
              "#1a1a50",
              "#202050",
              "#202060",
              "#202070",
          ]

          for color in dark_stat_colors:

              svg = svg.replace(
                  color,
                  "#f0f6fc"
              )


          # ========================================================
          # SAVE FINAL DARK SVG
          # ========================================================

          output_file.write_text(
              svg,
              encoding="utf-8"
          )


          print()
          print("==============================================")
          print(" DARK GIT BLOCK GENERATED SUCCESSFULLY")
          print("==============================================")
          print(f"Input : {input_file}")
          print(f"Output: {output_file}")
          print("==============================================")
          print()

          PY


      # ============================================================
      # 4. COMMIT AND PUSH
      # ============================================================

      - name: Commit & Push
        shell: bash
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "generated"

          # Pull latest remote changes before pushing
          git pull --rebase origin main

          # Push generated files
          git push origin HEAD:main
