name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub Profile 3D Contrib

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ============================================================
      # 2. GENERATE OFFICIAL 3D CONTRIBUTION GRAPH
      # ============================================================

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}


      # ============================================================
      # 3. CREATE DARK GIT BLOCK
      # ============================================================

      - name: Create Dark Git Block
        shell: bash
        run: |

          python3 <<'PY'

          from pathlib import Path
          import re


          # ========================================================
          # FILES
          # ========================================================

          INPUT = Path(
              "profile-3d-contrib/profile-gitblock.svg"
          )

          OUTPUT = Path(
              "profile-3d-contrib/profile-gitblock-dark.svg"
          )


          # ========================================================
          # READ ORIGINAL SVG
          # ========================================================

          svg = INPUT.read_text(
              encoding="utf-8"
          )


          # ========================================================
          # COLORS
          # ========================================================

          BACKGROUND = "#0d1117"
          EMPTY = "#161b22"
          GRID = "#30363d"

          TEXT = "#f0f6fc"
          SECONDARY = "#8b949e"

          GREEN = "#39d353"
          GREEN_DARK = "#2ea043"

          BLUE = "#58a6ff"
          BLUE_DARK = "#388bfd"

          PINK = "#f778ba"
          PINK_DARK = "#db61a2"

          GOLD = "#d29922"
          GOLD_LIGHT = "#e3b341"


          # ========================================================
          # BACKGROUND
          # ========================================================

          background_colors = {

              "#ffffff": BACKGROUND,
              "#FFFFFF": BACKGROUND,

              "#fff": BACKGROUND,
              "#FFF": BACKGROUND,

          }

          for old, new in background_colors.items():
              svg = svg.replace(old, new)


          # ========================================================
          # EMPTY CELLS
          # ========================================================

          empty_colors = {

              "#f8f8f8": EMPTY,
              "#F8F8F8": EMPTY,

              "#f5f5f5": EMPTY,
              "#F5F5F5": EMPTY,

              "#eeeeee": "#21262d",
              "#EEEEEE": "#21262d",

              "#dddddd": GRID,
              "#DDDDDD": GRID,

          }

          for old, new in empty_colors.items():
              svg = svg.replace(old, new)


          # ========================================================
          # GREEN LEGO BLOCKS
          # ========================================================

          green_colors = {

              "#00ff00": GREEN,
              "#00FF00": GREEN,

              "#00cc00": GREEN_DARK,
              "#00CC00": GREEN_DARK,

              "#00b300": GREEN_DARK,

              "#008000": "#238636",

              "#32cd32": GREEN,

              "#228b22": "#238636",

          }

          for old, new in green_colors.items():
              svg = svg.replace(old, new)


          # ========================================================
          # BLUE LEGO BLOCKS
          # ========================================================

          blue_colors = {

              "#0000ff": BLUE,
              "#0000FF": BLUE,

              "#0000cc": BLUE_DARK,
              "#0000CC": BLUE_DARK,

              "#4169e1": BLUE,

              "#000080": "#1f6feb",

          }

          for old, new in blue_colors.items():
              svg = svg.replace(old, new)


          # ========================================================
          # RED / PINK LEGO BLOCKS
          # ========================================================

          red_colors = {

              "#ff0000": PINK,
              "#FF0000": PINK,

              "#cc0000": PINK_DARK,
              "#CC0000": PINK_DARK,

              "#8b0000": "#a40e4c",

          }

          for old, new in red_colors.items():
              svg = svg.replace(old, new)


          # ========================================================
          # YELLOW / GOLD LEGO BLOCKS
          # ========================================================

          yellow_colors = {

              "#ffff00": GOLD,
              "#FFFF00": GOLD,

              "#ffd700": GOLD_LIGHT,
              "#FFD700": GOLD_LIGHT,

              "#ffcc00": GOLD,
              "#FFCC00": GOLD,

          }

          for old, new in yellow_colors.items():
              svg = svg.replace(old, new)


          # ========================================================
          # GRID / BORDER COLORS
          # ========================================================

          grid_colors = {

              "#666666": SECONDARY,
              "#666": SECONDARY,

              "#999999": SECONDARY,
              "#999": SECONDARY,

              "#aaaaaa": SECONDARY,
              "#AAAAAA": SECONDARY,

              "#333333": GRID,
              "#333": GRID,

          }

          for old, new in grid_colors.items():
              svg = svg.replace(old, new)


          # ========================================================
          # RGB COLORS
          # ========================================================

          rgb_colors = {

              "rgb(0,255,0)": GREEN,
              "rgb(0, 255, 0)": GREEN,

              "rgb(0,0,255)": BLUE,
              "rgb(0, 0, 255)": BLUE,

              "rgb(255,0,0)": PINK,
              "rgb(255, 0, 0)": PINK,

              "rgb(255,255,0)": GOLD,
              "rgb(255, 255, 0)": GOLD,

          }

          for old, new in rgb_colors.items():
              svg = svg.replace(old, new)


          # ========================================================
          # FORCE ALL TEXT TO LIGHT COLOR
          # ========================================================

          # Fix <text> elements.

          def fix_text_tag(match):

              tag = match.group(0)

              # Remove existing fill attribute.
              tag = re.sub(
                  r'\sfill\s*=\s*["\'][^"\']*["\']',
                  "",
                  tag,
                  flags=re.IGNORECASE
              )

              # Add readable text color.
              tag = tag.replace(
                  "<text",
                  f'<text fill="{TEXT}"',
                  1
              )

              return tag


          svg = re.sub(
              r"<text\b[^>]*>",
              fix_text_tag,
              svg,
              flags=re.IGNORECASE
          )


          # ========================================================
          # FORCE TSPAN TEXT TO LIGHT COLOR
          # ========================================================

          def fix_tspan_tag(match):

              tag = match.group(0)

              tag = re.sub(
                  r'\sfill\s*=\s*["\'][^"\']*["\']',
                  "",
                  tag,
                  flags=re.IGNORECASE
              )

              tag = tag.replace(
                  "<tspan",
                  f'<tspan fill="{TEXT}"',
                  1
              )

              return tag


          svg = re.sub(
              r"<tspan\b[^>]*>",
              fix_tspan_tag,
              svg,
              flags=re.IGNORECASE
          )


          # ========================================================
          # FIX CSS TEXT COLORS
          # ========================================================

          svg = re.sub(
              r"fill\s*:\s*#000000",
              f"fill:{TEXT}",
              svg,
              flags=re.IGNORECASE
          )

          svg = re.sub(
              r"fill\s*:\s*#000",
              f"fill:{TEXT}",
              svg,
              flags=re.IGNORECASE
          )

          svg = re.sub(
              r"fill\s*:\s*black",
              f"fill:{TEXT}",
              svg,
              flags=re.IGNORECASE
          )


          # ========================================================
          # FORCE TEXT USING SVG STYLE
          # ========================================================

          CSS = f"""
          <style>
            text {{
              fill: {TEXT} !important;
              color: {TEXT} !important;
            }}

            tspan {{
              fill: {TEXT} !important;
              color: {TEXT} !important;
            }}
          </style>
          """


          svg = re.sub(
              r"(<svg\b[^>]*>)",
              r"\1" + CSS,
              svg,
              count=1,
              flags=re.IGNORECASE
          )


          # ========================================================
          # REMOVE STAR AND FORK STATISTICS
          # ========================================================
          #
          # The Git Block contains three bottom statistics:
          #
          #   contributions
          #   star
          #   fork
          #
          # We want to keep contributions and remove the other two.
          #
          # The generated GitBlock places these statistics near the
          # bottom of the SVG. We therefore remove visual elements
          # in the right-side statistic region while preserving the
          # contribution count on the left.
          #
          # ========================================================


          # --------------------------------------------------------
          # Remove star/fork icon paths based on common SVG colors.
          # --------------------------------------------------------

          # Replace isolated dark icon fills in the statistics area.
          # This does not touch the LEGO grid itself.

          def remove_stat_group(match):

              group = match.group(0)

              # Check for bottom statistic positioning.
              transform = re.search(
                  r'transform\s*=\s*["\'][^"\']*translate\([^)]*["\']',
                  group,
                  flags=re.IGNORECASE
              )

              return ""


          # --------------------------------------------------------
          # Remove explicit text nodes that represent star/fork
          # counters when they occur in the lower statistics area.
          # --------------------------------------------------------

          # Star/fork SVG symbols are often represented as paths,
          # while the numeric values are text. Remove text values
          # only when they occur in the bottom portion.
          #
          # We preserve the contribution number by NOT globally
          # removing all "0" values.
          # --------------------------------------------------------


          # ========================================================
          # REMOVE STAR / FORK ICONS BY COMMON SVG PATH IDs
          # ========================================================

          svg = re.sub(
              r'<g[^>]*(?:star|Star|STAR)[^>]*>.*?</g>',
              "",
              svg,
              flags=re.IGNORECASE | re.DOTALL
          )

          svg = re.sub(
              r'<g[^>]*(?:fork|Fork|FORK)[^>]*>.*?</g>',
              "",
              svg,
              flags=re.IGNORECASE | re.DOTALL
          )


          # ========================================================
          # REMOVE COMMON STAR / FORK SYMBOL PATHS
          # ========================================================

          # GitHub-style star icon paths generally contain a
          # characteristic sequence beginning with these commands.
          #
          # We only target paths that are located in the lower
          # statistic area using nearby transform information.

          stat_pattern = re.compile(
              r'<g([^>]*)>(.*?)</g>',
              flags=re.IGNORECASE | re.DOTALL
          )


          def process_group(match):

              attributes = match.group(1)
              content = match.group(2)

              combined = attributes + content

              # Only inspect groups with a translate/position.
              if not re.search(
                  r'translate\s*\(',
                  combined,
                  flags=re.IGNORECASE
              ):
                  return match.group(0)

              # Look for star/fork-like SVG paths.
              has_path = "<path" in content.lower()

              if not has_path:
                  return match.group(0)

              # Do not remove groups containing the contribution
              # graph itself.
              if any(
                  word in combined.lower()
                  for word in [
                      "contribution",
                      "calendar",
                      "grid",
                      "legend",
                      "language",
                      "radar"
                  ]
              ):
                  return match.group(0)

              # Remove groups containing the most common icon
              # shapes only when they are near the bottom.
              #
              # The bottom stats are below the main graph.
              transform_match = re.search(
                  r'translate\s*\(\s*([-\d.]+)[,\s]+([-\d.]+)',
                  combined,
                  flags=re.IGNORECASE
              )

              if transform_match:

                  try:

                      x = float(
                          transform_match.group(1)
                      )

                      y = float(
                          transform_match.group(2)
                      )

                      # GitBlock SVG is approximately 1400x1000.
                      # Star/fork icons are located toward the
                      # bottom-middle/right.
                      if y > 800 and x > 550:

                          return ""

                  except ValueError:
                      pass

              return match.group(0)


          svg = stat_pattern.sub(
              process_group,
              svg
          )


          # ========================================================
          # SAVE
          # ========================================================

          OUTPUT.write_text(
              svg,
              encoding="utf-8"
          )


          print()
          print("==============================================")
          print(" DARK GIT BLOCK GENERATED")
          print("==============================================")
          print(f"Input       : {INPUT}")
          print(f"Output      : {OUTPUT}")
          print(f"Background  : {BACKGROUND}")
          print(f"Text        : {TEXT}")
          print(f"Grid        : {GRID}")
          print(f"Green       : {GREEN}")
          print(f"Blue        : {BLUE}")
          print(f"Pink        : {PINK}")
          print(f"Gold        : {GOLD}")
          print("Star        : REMOVED")
          print("Fork        : REMOVED")
          print("==============================================")
          print()

          PY


      # ============================================================
      # 4. COMMIT AND PUSH
      # ============================================================

      - name: Commit & Push
        shell: bash
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "generated"

          git pull --rebase origin main

          git push origin HEAD:main
