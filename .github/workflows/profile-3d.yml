name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub Profile 3D Contribution Graph

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ---------------------------------------------------------
      # 2. Generate the original Git Block SVG
      # ---------------------------------------------------------
      - name: Generate GitHub 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}


      # ---------------------------------------------------------
      # 3. Convert Git Block to dark GitHub-style version
      # ---------------------------------------------------------
      - name: Create Dark Git Block
        shell: bash
        run: |

          python3 <<'PY'

          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET


          INPUT = Path(
              "profile-3d-contrib/profile-gitblock.svg"
          )

          OUTPUT = Path(
              "profile-3d-contrib/profile-gitblock-dark.svg"
          )


          if not INPUT.exists():
              raise SystemExit(
                  f"ERROR: {INPUT} was not generated."
              )


          svg = INPUT.read_text(
              encoding="utf-8"
          )


          # =====================================================
          # COLORS
          # =====================================================

          BACKGROUND = "#0d1117"

          TEXT = "#f0f6fc"
          SECONDARY = "#8b949e"

          GRID = "#30363d"
          EMPTY = "#161b22"

          GREEN = "#39d353"
          GREEN_DARK = "#238636"

          BLUE = "#58a6ff"
          BLUE_DARK = "#1f6feb"

          PINK = "#f778ba"
          PINK_DARK = "#db61a2"

          GOLD = "#e3b341"
          GOLD_DARK = "#d29922"


          # =====================================================
          # 4. DARK BACKGROUND
          # =====================================================

          background_replacements = {

              "#ffffff": BACKGROUND,
              "#FFFFFF": BACKGROUND,

              "#fff": BACKGROUND,
              "#FFF": BACKGROUND,

              "white": BACKGROUND,
              "WHITE": BACKGROUND,

          }

          for old, new in background_replacements.items():
              svg = svg.replace(old, new)


          # =====================================================
          # 5. EMPTY / LOW CONTRIBUTION CELLS
          # =====================================================

          empty_replacements = {

              "#f8f8f8": EMPTY,
              "#F8F8F8": EMPTY,

              "#f5f5f5": EMPTY,
              "#F5F5F5": EMPTY,

              "#eeeeee": "#21262d",
              "#EEEEEE": "#21262d",

              "#dddddd": GRID,
              "#DDDDDD": GRID,

          }

          for old, new in empty_replacements.items():
              svg = svg.replace(old, new)


          # =====================================================
          # 6. GREEN BLOCKS
          # =====================================================

          green_replacements = {

              "#00ff00": GREEN,
              "#00FF00": GREEN,

              "#00cc00": GREEN_DARK,
              "#00CC00": GREEN_DARK,

              "#00b300": GREEN_DARK,
              "#00B300": GREEN_DARK,

              "#008000": GREEN_DARK,

              "#32cd32": GREEN,
              "#32CD32": GREEN,

              "#228b22": GREEN_DARK,
              "#228B22": GREEN_DARK,

          }

          for old, new in green_replacements.items():
              svg = svg.replace(old, new)


          # =====================================================
          # 7. BLUE BLOCKS
          # =====================================================

          blue_replacements = {

              "#0000ff": BLUE,
              "#0000FF": BLUE,

              "#0000cc": BLUE_DARK,
              "#0000CC": BLUE_DARK,

              "#4169e1": BLUE,
              "#4169E1": BLUE,

              "#000080": BLUE_DARK,

          }

          for old, new in blue_replacements.items():
              svg = svg.replace(old, new)


          # =====================================================
          # 8. RED / PINK BLOCKS
          # =====================================================

          red_replacements = {

              "#ff0000": PINK,
              "#FF0000": PINK,

              "#cc0000": PINK_DARK,
              "#CC0000": PINK_DARK,

              "#8b0000": "#a40e4c",
              "#8B0000": "#a40e4c",

          }

          for old, new in red_replacements.items():
              svg = svg.replace(old, new)


          # =====================================================
          # 9. YELLOW BLOCKS
          # =====================================================

          yellow_replacements = {

              "#ffff00": GOLD,
              "#FFFF00": GOLD,

              "#ffd700": GOLD,
              "#FFD700": GOLD,

              "#ffcc00": GOLD_DARK,
              "#FFCC00": GOLD_DARK,

          }

          for old, new in yellow_replacements.items():
              svg = svg.replace(old, new)


          # =====================================================
          # 10. GRID / GREY COLORS
          # =====================================================

          grey_replacements = {

              "#666666": SECONDARY,
              "#666": SECONDARY,

              "#999999": SECONDARY,
              "#999": SECONDARY,

              "#aaaaaa": SECONDARY,
              "#AAAAAA": SECONDARY,

              "#333333": GRID,
              "#333": GRID,

          }

          for old, new in grey_replacements.items():
              svg = svg.replace(old, new)


          # =====================================================
          # 11. RGB COLOR REPLACEMENTS
          # =====================================================

          rgb_replacements = {

              "rgb(0,255,0)": GREEN,
              "rgb(0, 255, 0)": GREEN,

              "rgb(0,0,255)": BLUE,
              "rgb(0, 0, 255)": BLUE,

              "rgb(255,0,0)": PINK,
              "rgb(255, 0, 0)": PINK,

              "rgb(255,255,0)": GOLD,
              "rgb(255, 255, 0)": GOLD,

          }

          for old, new in rgb_replacements.items():
              svg = svg.replace(old, new)


          # =====================================================
          # 12. FORCE ALL TEXT TO LIGHT COLOR
          # =====================================================

          def fix_text_tag(match):

              tag = match.group(0)

              tag = re.sub(
                  r'\sfill\s*=\s*["\'][^"\']*["\']',
                  "",
                  tag,
                  flags=re.IGNORECASE
              )

              return tag.replace(
                  "<text",
                  f'<text fill="{TEXT}"',
                  1
              )


          svg = re.sub(
              r"<text\b[^>]*>",
              fix_text_tag,
              svg,
              flags=re.IGNORECASE
          )


          def fix_tspan_tag(match):

              tag = match.group(0)

              tag = re.sub(
                  r'\sfill\s*=\s*["\'][^"\']*["\']',
                  "",
                  tag,
                  flags=re.IGNORECASE
              )

              return tag.replace(
                  "<tspan",
                  f'<tspan fill="{TEXT}"',
                  1
              )


          svg = re.sub(
              r"<tspan\b[^>]*>",
              fix_tspan_tag,
              svg,
              flags=re.IGNORECASE
          )


          # =====================================================
          # 13. FIX INLINE BLACK TEXT
          # =====================================================

          svg = re.sub(
              r'fill\s*:\s*#000000',
              f'fill:{TEXT}',
              svg,
              flags=re.IGNORECASE
          )

          svg = re.sub(
              r'fill\s*:\s*#000',
              f'fill:{TEXT}',
              svg,
              flags=re.IGNORECASE
          )

          svg = re.sub(
              r'fill\s*:\s*black',
              f'fill:{TEXT}',
              svg,
              flags=re.IGNORECASE
          )


          # =====================================================
          # 14. ADD DARK-MODE TEXT CSS
          # =====================================================

          CSS = f"""
          <style>

            text {{
              fill: {TEXT} !important;
            }}

            tspan {{
              fill: {TEXT} !important;
            }}

          </style>
          """


          svg = re.sub(
              r"(<svg\b[^>]*>)",
              r"\1" + CSS,
              svg,
              count=1,
              flags=re.IGNORECASE
          )


          # =====================================================
          # 15. REMOVE STAR + FORK ICONS
          #
          # The icons are graphical SVG elements, so searching
          # for "star" or "fork" in the <g> tag is unreliable.
          #
          # Instead we remove black graphical elements that occur
          # in the bottom statistics area.
          # =====================================================


          def remove_bottom_black_graphics(svg_text):

              # Match graphical SVG elements.
              #
              # We intentionally do NOT remove <text> elements.
              # Therefore the contribution numbers and labels stay.

              pattern = re.compile(
                  r'<(path|circle|rect|polygon|polyline|line|ellipse)\b'
                  r'([^>]*)>'
                  r'(?:.*?</\1>)?',
                  flags=re.IGNORECASE | re.DOTALL
              )


              def process(match):

                  element = match.group(0)

                  attrs = match.group(2)


                  # -------------------------------------------------
                  # Find explicit black fill/stroke
                  # -------------------------------------------------

                  black_fill = re.search(
                      r'(?:fill)\s*=\s*["\']'
                      r'(?:#000000|#000|black)'
                      r'["\']',
                      attrs,
                      flags=re.IGNORECASE
                  )


                  black_stroke = re.search(
                      r'(?:stroke)\s*=\s*["\']'
                      r'(?:#000000|#000|black)'
                      r'["\']',
                      attrs,
                      flags=re.IGNORECASE
                  )


                  # Also detect inline style.
                  black_style = re.search(
                      r'(?:fill|stroke)\s*:\s*'
                      r'(?:#000000|#000|black)',
                      attrs,
                      flags=re.IGNORECASE
                  )


                  if not (
                      black_fill
                      or black_stroke
                      or black_style
                  ):
                      return element


                  # -------------------------------------------------
                  # Detect coordinates.
                  #
                  # The bottom statistics row is the only area
                  # where these black icon graphics occur.
                  # -------------------------------------------------

                  coordinates = []


                  for attr in [
                      "x",
                      "y",
                      "cx",
                      "cy",
                      "x1",
                      "x2",
                      "y1",
                      "y2"
                  ]:

                      matches = re.findall(
                          rf'\b{attr}\s*=\s*["\']'
                          rf'(-?\d+(?:\.\d+)?)',
                          attrs,
                          flags=re.IGNORECASE
                      )

                      for value in matches:

                          try:
                              coordinates.append(float(value))
                          except:
                              pass


                  # -------------------------------------------------
                  # Look at transforms.
                  # -------------------------------------------------

                  transforms = re.findall(
                      r'translate\s*\('
                      r'\s*(-?\d+(?:\.\d+)?)'
                      r'[\s,]+'
                      r'(-?\d+(?:\.\d+)?)',
                      attrs,
                      flags=re.IGNORECASE
                  )


                  for x, y in transforms:

                      try:

                          coordinates.append(float(x))
                          coordinates.append(float(y))

                      except:
                          pass


                  # -------------------------------------------------
                  # Bottom stats icons have positions near the
                  # lower part of the SVG.
                  #
                  # We use BOTH the SVG height and absolute values.
                  # -------------------------------------------------

                  svg_height_match = re.search(
                      r'<svg\b[^>]*height\s*=\s*["\']'
                      r'(\d+(?:\.\d+)?)',
                      svg_text,
                      flags=re.IGNORECASE
                  )


                  if svg_height_match:

                      svg_height = float(
                          svg_height_match.group(1)
                      )

                  else:

                      # GitBlock normally has a large canvas.
                      svg_height = 1100


                  bottom_threshold = svg_height * 0.70


                  # If the element contains a coordinate in the
                  # bottom 30% and is black, remove it.

                  if any(
                      value >= bottom_threshold
                      for value in coordinates
                  ):

                      return ""


                  # -------------------------------------------------
                  # Handle groups/paths whose coordinates are stored
                  # in path data rather than x/y attributes.
                  #
                  # If it is a black path and appears to be a small
                  # bottom statistic icon, detect its transform.
                  # -------------------------------------------------

                  if not coordinates:

                      path_transform = re.search(
                          r'translate\s*\('
                          r'\s*(-?\d+(?:\.\d+)?)'
                          r'[\s,]+'
                          r'(-?\d+(?:\.\d+)?)',
                          element,
                          flags=re.IGNORECASE
                      )

                      if path_transform:

                          try:

                              y = float(
                                  path_transform.group(2)
                              )

                              if y >= bottom_threshold:

                                  return ""

                          except:
                              pass


                  return element


              return pattern.sub(
                  process,
                  svg_text
              )


          svg = remove_bottom_black_graphics(svg)


          # =====================================================
          # 16. SECOND PASS:
          #
          # Remove obvious black icon groups in bottom area.
          # This catches star/fork paths wrapped in <g>.
          # =====================================================

          def remove_black_bottom_groups(svg_text):

              group_pattern = re.compile(
                  r'<g\b([^>]*)>(.*?)</g>',
                  flags=re.IGNORECASE | re.DOTALL
              )


              svg_height_match = re.search(
                  r'<svg\b[^>]*height\s*=\s*["\']'
                  r'(\d+(?:\.\d+)?)',
                  svg_text,
                  flags=re.IGNORECASE
              )


              if svg_height_match:

                  svg_height = float(
                      svg_height_match.group(1)
                  )

              else:

                  svg_height = 1100


              bottom_threshold = svg_height * 0.70


              def process_group(match):

                  attrs = match.group(1)
                  content = match.group(2)

                  combined = attrs + content


                  # Never remove text groups.
                  if "<text" in content.lower():
                      return match.group(0)


                  # Must contain a black graphic.
                  black_graphic = re.search(
                      r'(?:fill|stroke)\s*=\s*["\']'
                      r'(?:#000000|#000|black)'
                      r'["\']',
                      combined,
                      flags=re.IGNORECASE
                  )


                  if not black_graphic:
                      return match.group(0)


                  # Find transform coordinates.
                  transforms = re.findall(
                      r'translate\s*\('
                      r'\s*(-?\d+(?:\.\d+)?)'
                      r'[\s,]+'
                      r'(-?\d+(?:\.\d+)?)',
                      combined,
                      flags=re.IGNORECASE
                  )


                  for x, y in transforms:

                      try:

                          y = float(y)

                          if y >= bottom_threshold:

                              return ""

                      except:
                          pass


                  # Look for bottom-positioned coordinates.
                  values = []

                  for attr in [
                      "x",
                      "y",
                      "cx",
                      "cy"
                  ]:

                      for value in re.findall(
                          rf'\b{attr}\s*=\s*["\']'
                          rf'(-?\d+(?:\.\d+)?)',
                          combined,
                          flags=re.IGNORECASE
                      ):

                          try:
                              values.append(float(value))
                          except:
                              pass


                  if any(
                      value >= bottom_threshold
                      for value in values
                  ):

                      return ""


                  return match.group(0)


              return group_pattern.sub(
                  process_group,
                  svg_text
              )


          svg = remove_black_bottom_groups(svg)


          # =====================================================
          # 17. FINAL TEXT CSS
          # =====================================================

          FINAL_CSS = f"""
          <style>

            text,
            tspan {{
              fill: {TEXT} !important;
            }}

          </style>
          """


          svg = re.sub(
              r"(<svg\b[^>]*>)",
              r"\1" + FINAL_CSS,
              svg,
              count=1,
              flags=re.IGNORECASE
          )


          # =====================================================
          # 18. WRITE OUTPUT
          # =====================================================

          OUTPUT.write_text(
              svg,
              encoding="utf-8"
          )


          print("")
          print("==============================================")
          print(" DARK GIT BLOCK GENERATED")
          print("==============================================")
          print(f"Input :  {INPUT}")
          print(f"Output:  {OUTPUT}")
          print("")
          print("Background : #0d1117")
          print("Text       : #f0f6fc")
          print("Empty      : #161b22")
          print("")
          print("Bottom black graphical elements removed.")
          print("==============================================")
          print("")


          PY


      # ---------------------------------------------------------
      # 19. Commit and push generated files
      # ---------------------------------------------------------
      - name: Commit & Push
        shell: bash
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "generated"

          # Prevent non-fast-forward errors
          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
